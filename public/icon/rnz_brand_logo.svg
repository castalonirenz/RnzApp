<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>RNZ Personal Tracker — Brand Logo</title>

  <rect width="500" height="500" fill="white"/>

  <!-- Hexagon mark -->
  <polygon points="250,60 332,108 332,204 250,252 168,204 168,108" fill="#1D9E75"/>
  <polygon points="250,76 320,116 320,196 250,236 180,196 180,116" fill="none" stroke="#5DCAA5" stroke-width="2"/>

  <!-- R -->
  <text x="182" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="white">R</text>
  <!-- N -->
  <text x="229" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="white">N</text>
  <!-- Z accent -->
  <text x="285" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="#9FE1CB">Z</text>

  <!-- Accent underline -->
  <rect x="182" y="216" width="140" height="5" rx="2.5" fill="#5DCAA5" opacity="0.65"/>

  <!-- Wordmark -->
  <text x="250" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#085041" letter-spacing="10">RNZ</text>

  <!-- Tagline -->
  <text x="250" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#1D9E75" letter-spacing="4">PERSONAL TRACKER</text>

  <!-- Divider -->
  <line x1="150" y1="342" x2="350" y2="342" stroke="#9FE1CB" stroke-width="0.8"/>

  <!-- Budget bars icon -->
  <rect x="196" y="358" width="6" height="18" rx="2" fill="#1D9E75" opacity="0.5"/>
  <rect x="206" y="350" width="6" height="26" rx="2" fill="#1D9E75" opacity="0.7"/>
  <rect x="216" y="342" width="6" height="34" rx="2" fill="#1D9E75" opacity="0.9"/>

  <!-- Separator dot -->
  <circle cx="240" cy="358" r="2.5" fill="#9FE1CB"/>

  <!-- Lending arrows icon -->
  <path d="M252 352 Q260 345 268 352" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/>
  <path d="M252 366 Q260 373 268 366" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/>

  <!-- Separator dot -->
  <circle cx="284" cy="358" r="2.5" fill="#9FE1CB"/>

  <!-- People dots icon -->
  <circle cx="296" cy="355" r="4" fill="#1D9E75" opacity="0.55"/>
  <circle cx="306" cy="355" r="4" fill="#1D9E75" opacity="0.78"/>
  <circle cx="316" cy="355" r="4" fill="#1D9E75"/>
</svg>
